<!doctype html>
<!-- PROTOTYPE, throwaway. Answers "What does our own Bangkok flood map look like?" (Thrivbe/situational-globe#9).
     Two views: ?variant=A (2D ops board + radar timeline) and ?variant=B (3D city). Our own code. Live data, no backend.
     File owners: ui.js + style.css + index.html (panels & UI), data.js + layers2d.js + layers2d.css (2D layers & data), city3d.js (3D city), feeds.js + README.md (feed coverage). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok flood map (prototype)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.7.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="layers2d.css">
<link rel="icon" href="data:,">
</head>
<body>
<header id="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><b data-t="brand">Bangkok flood watch</b><span class="dim" data-t="tag">Live road and rain situation · prototype</span></div></div>
  <div class="search"><input id="find" list="dlist" type="search" autocomplete="off" data-tp="search" placeholder="Check my district" aria-label="Check my district"><datalist id="dlist"></datalist><button id="nearbtn" type="button" class="tbtn" data-t="near" title="Show flooding within 3 km of your position">Near me</button></div>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="tools">
    <div id="lang" class="seg" role="group" aria-label="Language"><button data-lg="en" class="on">EN</button><button data-lg="th">ไทย</button></div>
    <button id="srcbtn" class="tbtn" aria-expanded="false" aria-controls="sources" data-t="sources">Sources</button>
    <nav id="switcher" class="seg" aria-label="View"></nav>
  </div>
</header>
<div id="sources" class="sources" hidden></div>
<div id="near" class="near" hidden></div>
<main id="app"><div class="loading">Loading live Bangkok data…</div></main>
<script type="module" src="ui.js"></script>
</body>
</html>
